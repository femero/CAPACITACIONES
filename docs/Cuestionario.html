<form id="encuesta">
  <input name="nombre" required>
  <input name="puntaje" type="number" min="1" max="5" required>
  <textarea name="comentario"></textarea>
  <button type="submit">Enviar</button>
</form>

<script>
const URL_FLUJO = "https://c1ea623fd981e3039097b3e3289619.48.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/05/workflows/956767c067a84d48b001999c783a5183/triggers/manual/paths/invoke?api-version=1";

document.getElementById("encuesta").addEventListener("submit", async (e) => {
  e.preventDefault();
  const datos = Object.fromEntries(new FormData(e.target));
  datos.puntaje = Number(datos.puntaje);

  const res = await fetch(URL_FLUJO, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(datos)
  });
  alert(res.ok ? "¡Gracias por responder!" : "Error al enviar");
});
</script>
